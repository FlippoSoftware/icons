name: Update icons from Figma

on:
    workflow_dispatch:
    # Every Monday, so the catalogue follows Figma without a manual run (no pull request when nothing changed).
    schedule:
        - cron: '0 6 * * 1'

permissions:
    contents: write
    pull-requests: write

concurrency:
    group: update-icons
    cancel-in-progress: false

jobs:
    update:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: main

            - uses: pnpm/action-setup@v4

            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Download SVGs and generate React icons
              env:
                  FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
                  FIGMA_FILE: ${{ vars.FIGMA_FILE }}
                  FIGMA_IDS: ${{ vars.FIGMA_IDS }}
                  FIGMA_PAGES: ${{ vars.FIGMA_PAGES }}
              run: pnpm redown

            - name: Verify generated packages
              run: pnpm check

            - name: Create pull request
              uses: peter-evans/create-pull-request@v7
              with:
                  token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
                  branch: automation/update-icons
                  delete-branch: true
                  base: main
                  commit-message: 'feat(icons): update catalogue from Figma'
                  title: 'feat(icons): update catalogue from Figma'
                  body: |
                      Updates the SVG icon catalogue and generated React icon components from Figma.

                      Generated by the **Update icons from Figma** workflow.