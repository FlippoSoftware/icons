name: Lint commit messages


on:
    pull_request:


permissions:
    contents: read

jobs:
    commit-lint:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
              with:
                fetch-depth: 0

            - name: Lint commit messages
              uses: wagoid/commitlint-github-action@v6

