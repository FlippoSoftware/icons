name: Pull request title

# Pull requests are squash-merged: the title becomes the commit on main, and release-please reads it (fix → patch,
# feat → minor, `!` or BREAKING CHANGE → major; refactor, chore, docs… release nothing). The commits of the branch
# itself are free-form.

on:
    pull_request:
        types: [opened, edited, reopened, synchronize]

permissions:
    pull-requests: read

jobs:
    title:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: amannn/action-semantic-pull-request@v6
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              with:
                  types: |
                      feat
                      fix
                      perf
                      revert
                      deps
                      refactor
                      docs
                      style
                      test
                      build
                      ci
                      chore
                  # `feat(react-icons): add the spinner`: a lowercase subject, no full stop.
                  subjectPattern: ^(?![A-Z]).+[^.]$
                  subjectPatternError: |
                      The subject "{subject}" of "{title}" must start with a lowercase letter and not end with a full stop.
